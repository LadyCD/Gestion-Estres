spring.application.name=gestion-estres
server.port=8080

# ---------------------------------------------------------------
# Base de datos MySQL (script proyecto.sql + cambios_bd_HU.sql)
# Usuario y clave: variables de entorno DB_USER y DB_PASSWORD.
# Si no existen, se usa root sin clave.
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_estres?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
#spring.datasource.username=${DB_USER:root}
#spring.datasource.password=${DB_PASSWORD:}
spring.datasource.username=root
spring.datasource.password=2217Fabian.,
# Las tablas las crea el script SQL, NO Hibernate.
# validate: al arrancar comprueba que cada entidad coincida con su tabla.
#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.time-zone=America/Bogota

# ---------------------------------------------------------------
# Reglas de negocio configurables (no se fijan en el código)
# Si cambian con la validación INVEST, solo se ajustan aquí.
# ---------------------------------------------------------------
# HU001: dominios de correo permitidos para el registro (separados por coma)
app.registro.dominios-permitidos=ucentral.edu.co
app.registro.version-consentimiento=1.0

# HU020: bloqueo por intentos fallidos y vencimiento de la sesión
app.seguridad.intentos-maximos=5
app.seguridad.minutos-bloqueo=15
app.seguridad.minutos-inactividad-sesion=15

# HU026: ventanas de 15 minutos; se eliminan a las 24 horas
app.sincronizacion.minutos-ventana=15
app.sincronizacion.horas-retencion=24

# HU025: línea base individual
app.linea-base.dias-requeridos=5
app.linea-base.ventanas-minimas-por-dia=16

# HU003: clasificación cada 60 minutos; umbral de 1 desviación estándar
app.deteccion.minutos-evaluacion=60
app.deteccion.desviaciones-umbral=1.0
