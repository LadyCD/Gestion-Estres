plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ucentral.gestionestres.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ucentral.gestionestres.app'
        minSdk 28          // Android 9: versión mínima de Health Connect (HU008)
        targetSdk 36
        versionCode 1
        versionName '0.1.0'

        // Desde el emulador, 10.0.2.2 es el localhost del computador donde corre el backend.
        // En un teléfono físico, cambiar por la IP del computador en la misma red Wi-Fi.
        buildConfigField 'String', 'API_URL', '"http://10.0.2.2:8080/"'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // HU002, HU026: lectura de frecuencia cardíaca y HRV
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // HU026: sincronización periódica en segundo plano
    implementation 'androidx.work:work-runtime:2.10.0'
    // Worker (Java) expone ListenableFuture de Guava. Otra librería trae la versión
    // "vacía" (9999.0-empty), por eso se agrega Guava completa para Android
    implementation 'com.google.guava:guava:33.3.1-android'

    // Cliente HTTP del backend
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
}
